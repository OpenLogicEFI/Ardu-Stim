; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env]
monitor_speed = 115200 

[env:diecimilaatmega328]
platform = atmelavr
board = diecimilaatmega328
framework = arduino

[env:nano]
platform = atmelavr
board = nanoatmega328
framework = arduino

[platformio]
src_dir=ardustim

[env:uno]
platform = atmelavr
board = uno
framework = arduino

[env:blackpill_f401cc]
platform = ststm32@19.7.1
board = blackpill_f401cc
framework = arduino
upload_protocol = dfu
; Reserve sector 5 (128 KiB) for settings; firmware occupies sectors 0-4.
board_upload.maximum_size = 131072
build_flags =
    -DARDUSTIM_F401
    -DPIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -DUSBCON
    -DUSBD_VID=0x0483
    -DUSBD_PID=0x5740
    -DFLASH_DATA_SECTOR=5
    -DFLASH_BASE_ADDRESS=0x08020000

; Common 4 MiB ESP32-C3 Super Mini, built-in USB Serial/JTAG (not DFU).
[env:esp32c3_supermini]
platform = espressif32@6.12.0
board = esp32-c3-devkitm-1
framework = arduino
upload_protocol = esptool
board_build.flash_mode = dio
build_flags =
    -DARDUSTIM_ESP32C3
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
